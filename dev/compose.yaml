name: agent-foundation-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: foundation
      POSTGRES_USER: foundation
      POSTGRES_PASSWORD: foundation
    ports:
      - "127.0.0.1:${FOUNDATION_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundation -d foundation"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - foundation-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${FOUNDATION_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - foundation-redis:/data

volumes:
  foundation-postgres:
  foundation-redis:
