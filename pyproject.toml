[project]
name = "converge-agent-foundation"
version = "0.0.0"
description = "Cloud foundation with an agent harness, hosted agents, and observability"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "deptry>=0.25,<0.26",
    "grpcio-tools>=1.75,<2",
    "mdformat==1.0.0",
    "mdformat-footnote==0.1.3",
    "mdformat-front-matters==2.0.0",
    "mdformat-gfm==1.0.0",
    "pre-commit>=4.3,<5",
    "protobuf>=6.32,<7",
    "pyright>=1.1,<2",
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
    "testcontainers[postgres,redis]>=4.8,<5",
]
docs = [
    "mkdocs-material>=9.6,<10",
]

[tool.uv]
default-groups = ["dev", "docs"]
package = false

[tool.uv.sources]
converge-logging = { workspace = true }

[tool.ruff]
target-version = "py313"
line-length = 120
fix = true

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.pyright]
include = [
    "packages/agent-envd-client/converge_agent_envd_client",
    "packages/agent-harness/converge_agent_harness",
    "packages/logging/converge_logging",
    "packages/foundation-service/converge_foundation_service",
    "scripts/check-release-version.py",
    "scripts/create-github-release.py",
    "scripts/eip_codegen",
    "scripts/prepare-release-version.py",
    "scripts/release_notes.py",
    "scripts/release_version.py",
]
exclude = ["**/tests", "**/node_modules", "**/__pycache__", "**/.*", ".venv"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportTypedDictNotRequiredAccess = false

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = [
    "packages/agent-envd-client/tests",
    "packages/agent-harness/tests",
    "packages/logging/tests",
    "packages/foundation-service/tests",
    "scripts/tests",
]
