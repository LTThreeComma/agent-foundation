[project]
name = "converge-agent-foundation"
version = "0.0.0"
description = "Open-source foundation for building and operating AI agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "mdformat==1.0.0",
    "mdformat-footnote==0.1.3",
    "mdformat-front-matters==2.0.0",
    "mdformat-gfm==1.0.0",
    "pre-commit>=4.3,<5",
    "pyright>=1.1,<2",
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
]
docs = [
    "mkdocs-material>=9.6,<10",
]

[tool.uv]
default-groups = ["dev", "docs"]
package = false

[tool.ruff]
target-version = "py313"
line-length = 120
fix = true

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.pyright]
include = [
    "packages/agent-harness/converge_agent_harness",
    "packages/foundation-service/converge_foundation_service",
]
exclude = ["**/tests", "**/node_modules", "**/__pycache__", "**/.*", ".venv"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportTypedDictNotRequiredAccess = false

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = [
    "packages/agent-harness/tests",
    "packages/foundation-service/tests",
]
