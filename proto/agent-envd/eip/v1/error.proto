syntax = "proto3";

package converge.agent_envd.eip.v1;

import "agent-envd/eip/v1/common.proto";
import "agent-envd/eip/v1/options.proto";
import "agent-envd/eip/v1/process.proto";

enum ErrorType {
  ERROR_TYPE_UNSPECIFIED = 0;
  ERROR_TYPE_PARSE_ERROR = 1 [(eip_enum_value).json_name = "parse_error"];
  ERROR_TYPE_INVALID_REQUEST = 2 [(eip_enum_value).json_name = "invalid_request"];
  ERROR_TYPE_METHOD_NOT_FOUND = 3 [(eip_enum_value).json_name = "method_not_found"];
  ERROR_TYPE_INVALID_PARAMS = 4 [(eip_enum_value).json_name = "invalid_params"];
  ERROR_TYPE_INTERNAL_ERROR = 5 [(eip_enum_value).json_name = "internal_error"];
  ERROR_TYPE_NOT_INITIALIZED = 6 [(eip_enum_value).json_name = "not_initialized"];
  ERROR_TYPE_ALREADY_INITIALIZED = 7 [(eip_enum_value).json_name = "already_initialized"];
  ERROR_TYPE_PROTOCOL_INCOMPATIBLE = 8 [(eip_enum_value).json_name = "protocol_incompatible"];
  ERROR_TYPE_DENIED = 9 [(eip_enum_value).json_name = "denied"];
  ERROR_TYPE_NOT_FOUND_OR_DENIED = 10 [(eip_enum_value).json_name = "not_found_or_denied"];
  ERROR_TYPE_UNSUPPORTED = 11 [(eip_enum_value).json_name = "unsupported"];
  ERROR_TYPE_STALE_GENERATION = 12 [(eip_enum_value).json_name = "stale_generation"];
  ERROR_TYPE_INVALID_HANDLE = 13 [(eip_enum_value).json_name = "invalid_handle"];
  ERROR_TYPE_RETENTION_GAP = 14 [(eip_enum_value).json_name = "retention_gap"];
  ERROR_TYPE_BUSY = 15 [(eip_enum_value).json_name = "busy"];
  ERROR_TYPE_QUOTA_EXCEEDED = 16 [(eip_enum_value).json_name = "quota_exceeded"];
  ERROR_TYPE_OUTPUT_LIMIT_EXCEEDED = 17 [(eip_enum_value).json_name = "output_limit_exceeded"];
  ERROR_TYPE_TIMEOUT = 18 [(eip_enum_value).json_name = "timeout"];
  ERROR_TYPE_CANCELLED = 19 [(eip_enum_value).json_name = "cancelled"];
  ERROR_TYPE_UNKNOWN_OUTCOME = 20 [(eip_enum_value).json_name = "unknown_outcome"];
  ERROR_TYPE_OPERATION_IN_PROGRESS = 21 [(eip_enum_value).json_name = "operation_in_progress"];
  ERROR_TYPE_IDEMPOTENCY_CONFLICT = 22 [(eip_enum_value).json_name = "idempotency_conflict"];
  ERROR_TYPE_PROVIDER_UNAVAILABLE = 23 [(eip_enum_value).json_name = "provider_unavailable"];
  ERROR_TYPE_EXECUTION_ISOLATION_FAILED = 24 [(eip_enum_value).json_name = "execution_isolation_failed"];
  ERROR_TYPE_CLEANUP_FAILED = 25 [(eip_enum_value).json_name = "cleanup_failed"];
  ERROR_TYPE_COMMAND_START_FAILED = 26 [(eip_enum_value).json_name = "command_start_failed"];
  ERROR_TYPE_CONFLICT = 27 [(eip_enum_value).json_name = "conflict"];
  ERROR_TYPE_INVALID_STATE = 28 [(eip_enum_value).json_name = "invalid_state"];
}

enum RetryHint {
  RETRY_HINT_UNSPECIFIED = 0;
  RETRY_HINT_NEVER = 1 [(eip_enum_value).json_name = "never"];
  RETRY_HINT_SAME_REQUEST = 2 [(eip_enum_value).json_name = "same_request"];
  RETRY_HINT_AFTER_REFRESH = 3 [(eip_enum_value).json_name = "after_refresh"];
  RETRY_HINT_AFTER_CAPACITY = 4 [(eip_enum_value).json_name = "after_capacity"];
  RETRY_HINT_AFTER_AUTHORITY_CHANGE = 5 [(eip_enum_value).json_name = "after_authority_change"];
  RETRY_HINT_RECONCILE_FIRST = 6 [(eip_enum_value).json_name = "reconcile_first"];
}

enum DispatchStage {
  DISPATCH_STAGE_UNSPECIFIED = 0;
  DISPATCH_STAGE_PRE_DISPATCH = 1 [(eip_enum_value).json_name = "pre_dispatch"];
  DISPATCH_STAGE_DISPATCHING = 2 [(eip_enum_value).json_name = "dispatching"];
  DISPATCH_STAGE_DISPATCHED = 3 [(eip_enum_value).json_name = "dispatched"];
  DISPATCH_STAGE_COMPLETED = 4 [(eip_enum_value).json_name = "completed"];
  DISPATCH_STAGE_UNKNOWN = 5 [(eip_enum_value).json_name = "unknown"];
}

message EIPErrorData {
  ErrorType error_type = 1;
  RetryHint retry_hint = 2;
  DispatchStage dispatch_stage = 3;
  optional string operation_id = 4 [(eip_field).string_format = EIP_STRING_FORMAT_IDENTIFIER];
  optional string environment_id = 5 [(eip_field).string_format = EIP_STRING_FORMAT_IDENTIFIER];
  optional uint64 generation = 6;
  optional string capability = 7;
  optional string field = 8;
  optional string handle_kind = 9;
  optional uint64 produced_bytes = 10;
  optional uint64 captured_bytes = 11;
  optional uint64 dropped_bytes = 12;
  optional uint64 emitted_items = 13;
  optional uint64 dropped_items = 14;
  optional ProcessStatus process_status = 15;
  optional OperationReceipt receipt = 16;
  optional string safe_detail = 17;
}

message EIPError {
  sint32 code = 1;
  string message = 2;
  EIPErrorData data = 3;
}
