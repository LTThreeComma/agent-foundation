[project]
name = "converge-agent-harness"
version = "0.0.0"
description = "Process-local agent harness built on Pydantic AI"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "converge-logging",
]

[dependency-groups]
test = [
    "pytest>=9,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["converge_agent_harness"]

[tool.deptry]
known_first_party = ["converge_agent_harness"]
package_module_name_map = { "converge-logging" = "converge_logging" }
