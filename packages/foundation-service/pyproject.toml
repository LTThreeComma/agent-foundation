[project]
name = "converge-foundation-service"
version = "0.0.0"
description = "Hosted control and execution service for Agent Foundation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.1,<2",
    "anyio>=4,<5",
    "click>=8.2,<9",
    "converge-logging",
    "fastapi>=0.116,<1",
    "httpx2>=2.5,<3",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "uvicorn>=0.35,<1",
]

[project.scripts]
foundation-service = "converge_foundation_service.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["converge_foundation_service"]

[tool.deptry]
known_first_party = ["converge_foundation_service"]
package_module_name_map = { "converge-logging" = "converge_logging", "httpx2" = "httpx2", "pydantic-settings" = "pydantic_settings", "psycopg" = "psycopg", "sqlalchemy" = "sqlalchemy" }

# httpx2 is the service-wide outbound client contract; psycopg is loaded by
# SQLAlchemy from the configured URL rather than imported directly.
[tool.deptry.per_rule_ignores]
DEP002 = ["httpx2", "psycopg"]
