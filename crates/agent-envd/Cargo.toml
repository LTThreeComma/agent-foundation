[package]
name = "converge-agent-envd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Environment daemon and protocol provider for Agent Foundation"
readme = "README.md"
keywords = ["agents", "ai", "cloud", "daemon", "sandbox"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "agent-envd"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
getrandom = "0.3.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1.47.1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }

[build-dependencies]
heck = "0.5.0"
prost = "0.14.1"
prost-build = "0.14.1"
prost-reflect = "0.16.2"
prost-types = "0.14.1"
sha2 = "0.10.9"
