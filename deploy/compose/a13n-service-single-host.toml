# Shared configuration of the single-host stack. The compose file adds the public URL and encryption key ring
# as A13N_<SECTION>__<FIELD> variables, which override this file.
[server]
host = "0.0.0.0"

[database]
url = "postgresql+psycopg://a13n_service:a13n_service@postgres:5432/a13n_service"

[redis]
url = "redis://redis:6379/0"

[objects]
root = "/app/var/objects"
