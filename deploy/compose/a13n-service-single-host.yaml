# Single-host Service: every role in one process, PostgreSQL, Redis and the Console.
# The Service shares the host Docker Engine and its authority.
name: a13n-service
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: a13n_service
      POSTGRES_USER: a13n_service
      POSTGRES_PASSWORD: a13n_service
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a13n_service -d a13n_service"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  service:
    image: ${A13N_SERVICE_IMAGE:-a13n-service:local}
    user: "10001:10001"
    group_add:
      - "${A13N_DOCKER_SOCKET_GID:?Set A13N_DOCKER_SOCKET_GID to the host Docker socket group ID}"
    environment:
      A13N_SERVER__PUBLIC_URL: http://127.0.0.1:${A13N_CONSOLE_PORT:-8080}
      A13N_ENCRYPTION__ACTIVE_KEY_ID: primary
      A13N_ENCRYPTION__KEYS: '{"primary": "${A13N_ENCRYPTION_KEY:?Generate and retain an encryption key}"}'
    volumes:
      - ./a13n-service-single-host.toml:/app/service.toml:ro
      - service-data:/app/var
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
  console:
    image: ${A13N_CONSOLE_IMAGE:-a13n-console:local}
    read_only: true
    tmpfs:
      - /tmp
    environment:
      A13N_SERVICE_UPSTREAM: http://service:8000
    ports:
      - "127.0.0.1:${A13N_CONSOLE_PORT:-8080}:8080"
    depends_on:
      service:
        condition: service_healthy
        # Nginx resolves the Service address once; follow a recreated Service container.
        restart: true
volumes:
  postgres:
  redis:
  service-data:
