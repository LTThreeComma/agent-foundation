name: Live Tests CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/ci-live-tests.yml"
      - "Makefile"
      - "conftest.py"
      - "dev/live_tests/**"
      - "packages/a13n-service/**"
      - "packages/a13n-harness/**"
      - "packages/a13n-envd-client/**"
      - "packages/a13n-stream-protocol/**"
      - "packages/a13n-logging/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-live-tests.yml"
      - "Makefile"
      - "conftest.py"
      - "dev/live_tests/**"
      - "packages/a13n-service/**"
      - "packages/a13n-harness/**"
      - "packages/a13n-envd-client/**"
      - "packages/a13n-stream-protocol/**"
      - "packages/a13n-logging/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  support:
    name: Live test support
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Validate fixtures and reviewed selections
        run: make live-test-check

  smoke:
    name: New Service execution journeys
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Require new execution journeys
        run: make live-test
