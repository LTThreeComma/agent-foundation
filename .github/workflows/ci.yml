name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      agent_envd: ${{ steps.filter.outputs.agent_envd }}
      agent_envd_client: ${{ steps.filter.outputs.agent_envd_client }}
      agent_harness: ${{ steps.filter.outputs.agent_harness }}
      eip_protocol: ${{ steps.filter.outputs.eip_protocol }}
      examples: ${{ steps.filter.outputs.examples }}
      foundation_web: ${{ steps.filter.outputs.foundation_web }}
      automation: ${{ steps.filter.outputs.automation }}
      containers: ${{ steps.filter.outputs.containers }}
      python: ${{ steps.filter.outputs.python }}
      sdk_go: ${{ steps.filter.outputs.sdk_go }}
      sdk_python: ${{ steps.filter.outputs.sdk_python }}
      sdk_rust: ${{ steps.filter.outputs.sdk_rust }}
      sdk_typescript: ${{ steps.filter.outputs.sdk_typescript }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            agent_envd:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'crates/agent-envd/**'
              - 'proto/agent-envd/eip/**'
              - 'scripts/eip_codegen/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'pyproject.toml'
              - 'uv.lock'
            agent_envd_client:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'packages/agent-envd-client/**'
              - 'proto/agent-envd/eip/**'
              - 'scripts/eip_codegen/**'
              - 'scripts/tests/test_eip_codegen.py'
              - 'pyproject.toml'
              - 'uv.lock'
            eip_protocol:
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-agent-envd.yml'
              - 'Makefile'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/agent-envd/Cargo.toml'
              - 'crates/agent-envd/build.rs'
              - 'crates/agent-envd/build_support/**'
              - 'crates/agent-envd/protocol/eip/**'
              - 'crates/agent-envd/src/eip/**'
              - 'crates/agent-envd/src/lib.rs'
              - 'packages/agent-envd-client/pyproject.toml'
              - 'packages/agent-envd-client/converge_agent_envd_client/eip/**'
              - 'packages/agent-envd-client/tests/eip/**'
              - 'proto/agent-envd/eip/**'
              - 'scripts/eip_codegen/**'
              - 'scripts/tests/test_eip_codegen.py'
              - 'spec/agent-envd/02-eip-protocol.md'
              - 'spec/agent-envd/08-protocol-source-client-and-generation.md'
              - 'pyproject.toml'
              - 'uv.lock'
            agent_harness:
              - '.github/workflows/ci.yml'
              - 'packages/agent-harness/**'
              - 'packages/logging/**'
              - 'pyproject.toml'
              - 'uv.lock'
            examples:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'examples/**'
              - 'packages/agent-harness/**'
              - 'pyproject.toml'
              - 'uv.lock'
            foundation_web:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'apps/foundation-web/**'
            automation:
              - '.github/**'
              - 'scripts/check-release-version.py'
            containers:
              - '.github/workflows/ci.yml'
              - '.dockerignore'
              - 'Makefile'
              - 'Dockerfile'
              - 'Dockerfile.sandbox'
              - 'scripts/docker-entrypoint.sh'
              - 'apps/foundation-web/**'
              - 'packages/**'
              - 'crates/agent-envd/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Cargo.toml'
              - 'Cargo.lock'
            python:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'packages/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
            sdk_go:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'sdk/go/**'
            sdk_python:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'pyproject.toml'
              - 'sdk/python/**'
            sdk_rust:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'Cargo.toml'
              - 'sdk/rust/**'
            sdk_typescript:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'sdk/typescript/**'

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run repository lint checks
        run: make lint

  automation:
    name: GitHub Actions
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.automation == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate workflows
        # actionlint 1.7.12 predates GitHub's concurrency queue syntax.
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
          -ignore 'unexpected key "queue" for "concurrency" section'

  eip-protocol:
    name: EIP protocol
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.eip_protocol == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: eip-protocol

      - name: Verify generated protocol and shared wire models
        run: make eip-check

  python:
    name: Python workspace
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run Python checks and build distributions
        run: make typecheck test python-build

  examples:
    name: Plugin examples
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: examples/plugins/uv.lock

      - name: Run complete plugin examples gate
        run: make examples-check-all

  foundation-web:
    name: Foundation Web
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.foundation_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/foundation-web/package-lock.json

      - name: Run complete Foundation Web checks
        run: make foundation-web-check-all

  agent-harness:
    name: Agent Harness (${{ matrix.name }})
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.agent_harness == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            architecture: arm64
          - name: Windows x64
            runner: windows-2025
            architecture: x64
          - name: Windows arm64
            runner: windows-11-arm
            architecture: arm64
          - name: macOS x64
            runner: macos-15-intel
            architecture: x64
          - name: macOS arm64
            runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.architecture }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Run Agent Harness tests
        run: >-
          uv run --locked --package converge-agent-harness --no-default-groups
          --group test python -m pytest packages/agent-harness/tests

  agent-envd-client:
    name: agent-envd client (${{ matrix.name }})
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.agent_envd_client == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            architecture: arm64
          - name: Windows x64
            runner: windows-2025
            architecture: x64
          - name: Windows arm64
            runner: windows-11-arm
            architecture: arm64
          - name: macOS x64
            runner: macos-15-intel
            architecture: x64
          - name: macOS arm64
            runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.architecture }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Run agent-envd client tests
        run: >-
          uv run --locked --package converge-agent-envd-client --no-default-groups
          --group test python -m pytest packages/agent-envd-client/tests

  agent-envd:
    name: agent-envd (${{ matrix.name }})
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.agent_envd == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            cache-key: linux-x64
            complete: true
            components: clippy, rustfmt
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            cache-key: linux-arm64
            complete: false
            components: ""
          - name: Windows x64
            runner: windows-2025
            cache-key: windows-x64
            complete: false
            components: ""
          - name: Windows arm64
            runner: windows-11-arm
            cache-key: windows-arm64
            complete: false
            components: ""
          - name: macOS x64
            runner: macos-15-intel
            cache-key: macos-x64
            complete: false
            components: ""
          - name: macOS arm64
            runner: macos-15
            cache-key: macos-arm64
            complete: false
            components: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: ${{ matrix.components }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: agent-envd-${{ matrix.cache-key }}

      - name: Run complete agent-envd checks
        if: matrix.complete
        run: make rust-check-all

      - name: Run agent-envd tests
        if: matrix.complete == false
        run: cargo test --locked --package converge-agent-envd

  sdk-python:
    name: Python SDK
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.sdk_python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: sdk/python/uv.lock

      - name: Run complete Python SDK checks
        run: make sdk-python-check-all

  sdk-go:
    name: Go SDK
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.sdk_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: sdk/go/go.mod
          cache: false

      - name: Run complete Go SDK checks
        run: make sdk-go-check-all

  sdk-rust:
    name: Rust SDK
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.sdk_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust -> target
          shared-key: foundation-sdk

      - name: Run complete Rust SDK checks
        run: make sdk-rust-check-all

  sdk-typescript:
    name: TypeScript SDK
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.sdk_typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Run complete TypeScript SDK checks
        run: make sdk-typescript-check-all

  containers:
    name: Container images
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and smoke-check images
        run: make image-check
