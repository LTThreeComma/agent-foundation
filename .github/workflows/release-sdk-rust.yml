name: Release Rust SDK

on:
  push:
    tags:
      - "release/sdk/rust/*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: release-sdk-rust
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Build Rust SDK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust -> target
          shared-key: foundation-sdk-release

      - name: Validate release version
        id: version
        run: |
          version="${GITHUB_REF_NAME#release/sdk/rust/}"
          python3 scripts/check-release-version.py sdk-rust "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run checks and package crate
        run: make sdk-rust-check-all

      - name: Upload crate
        uses: actions/upload-artifact@v4
        with:
          name: foundation-sdk-rust-crate
          path: sdk/rust/target/package/converge-foundation-sdk-*.crate
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Rust SDK to crates.io
    needs: build
    runs-on: ubuntu-latest
    environment: sdk-rust-crates-io
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --manifest-path sdk/rust/Cargo.toml

  create-release:
    name: Create GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download crate
        uses: actions/download-artifact@v4
        with:
          name: foundation-sdk-rust-crate
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Foundation SDK for Rust $VERSION"
